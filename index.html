<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimbun — Catatan Tanaman</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <div class="logo"><i>🌿</i>PlantCare</div>
  <button class="nav on" data-v="home">🏠 Beranda</button>
  <button class="nav" data-v="plants">🪴 Tanaman saya</button>
  <button class="nav" data-v="sched">📅 Jadwal perawatan <span class="n hide" id="nb">0</span></button>
  <button class="nav" data-v="guide">📖 Panduan tanaman</button>
  <div class="side-foot">
    <button class="nav" id="theme">🌙 Mode gelap</button>
    <button class="nav" id="exp">⬇️ Cadangkan data</button>
    <button class="nav" id="imp">⬆️ Pulihkan data</button>
    <input type="file" id="impf" accept=".json" class="hide">
  </div>
</aside>
<main>
  <header>
    <span>🔍</span><input id="q" placeholder="Cari tanamanmu…" aria-label="Cari tanaman">
    <button class="ic" id="theme2" title="Ganti tema">🌙</button>
    <button class="btn" id="add">+ Tambah tanaman</button>
  </header>
  <div class="wrap" id="app"></div>
</main>

<dialog id="dlg">
  <h2 id="dt">Tambah tanaman</h2>
  <form class="f" id="form" method="dialog">
    <label>Nama tanaman<input id="fn" required maxlength="40"></label>
    <div class="two">
      <label>Kategori<select id="fc"><option>Tanaman tropis</option><option>Tanaman berbunga</option><option>Sukulen</option><option>Tanaman hias daun</option><option>Tanaman obat</option><option>Sayur &amp; buah</option></select></label>
      <label>Lokasi<input id="fl" placeholder="Kamar, balkon…"></label>
    </div>
    <div class="two">
      <label>Siram setiap (hari)<input id="fi" type="number" min="0" max="60" value="3"></label>
      <label>Terakhir disiram<input id="fd" type="date"></label>
    </div>
    <label>Foto<input id="fp" type="file" accept="image/*"></label>
    <label>Catatan<textarea id="fnote" rows="3" placeholder="Cahaya, pupuk, hama…"></textarea></label>
    <div class="dact"><button type="button" class="btn ghost" id="cancel">Batal</button><button class="btn" id="save">Simpan</button></div>
  </form>
</dialog>
<dialog id="det"></dialog>
<div id="toast" role="status"></div>

<script src="script.js"></script>
</body>
</html>
