<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jadwal perawatan | Rimbun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/variables.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-active="jadwal">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <span class="eyebrow">Catatan perawatan</span>
            <h1>Jadwal perawatan</h1>
            <p>Catat aktivitas perawatan dan centang saat sudah dilakukan.</p>
          </div>
          <button class="btn btn-primary" id="addTaskBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah jadwal perawatan</button>
        </div>

        <section class="panel" style="max-width:760px">
          <div class="panel-head">
            <div><span class="eyebrow">Progres</span><h2>Perawatan</h2></div>
            <span class="count-pill" id="taskCount">0</span>
          </div>
          <div class="progress-row"><span>Progres perawatan</span><strong id="taskProgressText">0/0 selesai</strong></div>
          <div class="progress"><i id="taskProgressBar" style="width:0%"></i></div>
          <div id="taskList"></div>
        </section>

        <div class="modal-backdrop" id="modal">
          <form class="modal" id="taskForm" novalidate>
            <h2>Tambah jadwal perawatan</h2>
            <div class="field"><label for="fTanaman">Tanaman</label><select id="fTanaman"></select></div>
            <div class="field"><label for="fAktivitas">Jenis perawatan</label><select id="fAktivitas"></select></div>
            <div class="field" id="rowTanggal">
              <label for="fTanggal">Tanggal</label>
              <input id="fTanggal" type="date" />
              <span class="error">Tanggal wajib diisi.</span>
            </div>
            <div class="field"><label for="fKeterangan">Keterangan (opsional)</label><input id="fKeterangan" type="text" placeholder="Contoh: Pagi hari" /></div>
            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" id="cancelBtn">Batal</button>
              <button type="submit" class="btn btn-primary">Simpan</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/jadwal.js"></script>
</body>
</html>
